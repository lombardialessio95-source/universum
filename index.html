<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040f">
  <title>UNIVERSUM — Avvio sicuro</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    html,body{height:100%;margin:0;background:#02040f;color:#d7eaff;font:16px system-ui,sans-serif}
    main{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
    h1{font-size:clamp(24px,7vw,40px);letter-spacing:.14em;color:#93ccff;margin:0 0 18px}
    p{max-width:550px;color:#b6c8dc;line-height:1.55}
    button{margin-top:14px;background:#152d49;color:#e6f4ff;border:1px solid #3a688e;border-radius:8px;padding:12px 22px;cursor:pointer}
    button[hidden]{display:none}
    .small{font-size:12px;opacity:.7}
  </style>
</head>
<body>
<main>
  <h1>UNIVERSUM</h1>
  <p id="boot-status" role="status">Verifica della versione di gioco in corso…</p>
  <p class="small">I salvataggi locali e i dati del multiplayer non vengono cancellati.</p>
  <button id="boot-retry" type="button" hidden>Riprova</button>
</main>
<script>
/* Bootstrap senza moduli di gioco: nessun file viene eseguito prima della verifica della release. */
(() => {
  'use strict';
  const status = document.getElementById('boot-status');
  const retry = document.getElementById('boot-retry');
  const CLIENT_KIND = 'bootstrap';
  let navigating = false;
  let updating = false;
  let checkedThisOpening = false;
  const setStatus = text => { status.textContent = text; };
  const ask = (worker, type, timeout = 4000) => new Promise(resolve => {
    if (!worker) return resolve(null);
    const channel = new MessageChannel();
    let done = false;
    const finish = value => { if (done) return; done = true; clearTimeout(timer); channel.port1.close(); resolve(value); };
    const timer = setTimeout(() => finish(null), timeout);
    channel.port1.onmessage = e => finish(e.data);
    try { worker.postMessage({ type }, [channel.port2]); } catch (_) { finish(null); }
  });
  function openGame(info) {
    if (navigating || !info || !/^[a-z0-9-]+$/i.test(info.version || '')) return;
    navigating = true;
    // L'URL identifica la release del documento, ma la cache e' gestita dal Service Worker.
    location.replace('./app.html?release=' + encodeURIComponent(info.version));
  }
  navigator.serviceWorker?.addEventListener('message', event => {
    const d = event.data || {};
    if (d.type === 'UNIVERSUM_CAN_UPDATE' && event.ports?.[0]) {
      event.ports[0].postMessage({ safe: true, kind: CLIENT_KIND });
    }
    if (d.type === 'UNIVERSUM_UPDATE_BLOCKED') setStatus('Aggiornamento disponibile. Chiudi le altre schede di gioco per applicarlo in sicurezza.');
  });
  async function waitUntilControlled(version, timeoutMs = 7000) {
    const start = Date.now();
    while (Date.now() - start < timeoutMs) {
      const current = await ask(navigator.serviceWorker.controller, 'UNIVERSUM_GET_VERSION', 1200);
      if (current?.ready && current.version === version) return true;
      await new Promise(resolve => setTimeout(resolve, 140));
    }
    return false;
  }
  async function boot() {
    if (updating) return;
    updating = true;
    retry.hidden = true;
    try {
      if (!('serviceWorker' in navigator)) {
        setStatus('Questo browser non supporta Service Worker. Impossibile garantire una versione completa e coerente.');
        return;
      }
      // Offline: riusa la registrazione locale senza tentare di riscaricare lo script.
      const existing = await navigator.serviceWorker.getRegistration('./');
      const registration = navigator.onLine
        ? await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        : existing;
      if (!registration) {
        setStatus('Prima installazione senza rete: nessuna versione memorizzata. Riconnettiti per scaricare il gioco.');
        return;
      }
      if (!registration.__universumWatched) {
        registration.__universumWatched = true;
        const observe = worker => worker?.addEventListener('statechange', () => {
          if (['installed', 'activated', 'redundant'].includes(worker.state) && !navigating && !updating) boot();
        });
        registration.addEventListener('updatefound', () => observe(registration.installing));
        observe(registration.installing);
      }
      const active = navigator.serviceWorker.controller || registration.active;
      let current = await ask(active, 'UNIVERSUM_GET_VERSION');
      if (navigator.onLine && !checkedThisOpening) {
        checkedThisOpening = true;
        setStatus('Controllo degli aggiornamenti…');
        // Esegui il controllo AD OGNI apertura, senza affidarti all'intervallo interno del browser.
        try { await registration.update(); } catch (e) { console.warn('[Update] controllo remoto:', e); }
      }
      const ready = await ask(navigator.serviceWorker.controller || registration.active, 'UNIVERSUM_GET_VERSION');
      current = ready?.ready ? ready : current?.ready ? current : null;
      if (!current && registration.waiting) {
        setStatus('Preparazione della versione completa…');
      }
      // Nuova installazione: la prima attivazione avviene automaticamente al termine del precache.
      if (!current && registration.installing) {
        await new Promise(resolve => {
          const worker = registration.installing;
          const timer = setTimeout(resolve, 9000);
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' || worker.state === 'activated' || worker.state === 'redundant') { clearTimeout(timer); resolve(); }
          });
        });
        const r = await ask(navigator.serviceWorker.controller || registration.active, 'UNIVERSUM_GET_VERSION');
        if (r?.ready) current = r;
      }
      if (registration.waiting) {
        const worker = registration.waiting;
        const res = await ask(worker, 'UNIVERSUM_TRY_ACTIVATE', 7000);
        if (res?.activated) {
          // Resta sulla pagina di avvio mentre il browser cambia controller.
          await new Promise(resolve => {
            const timer = setTimeout(resolve, 5000);
            navigator.serviceWorker.addEventListener('controllerchange', () => { clearTimeout(timer); resolve(); }, { once: true });
          });
          const fresh = await ask(navigator.serviceWorker.controller || registration.active, 'UNIVERSUM_GET_VERSION');
          if (fresh?.ready) current = fresh;
        }
      }
      if (current?.ready) {
        if (await waitUntilControlled(current.version)) return openGame(current);
        setStatus('Attendo il controllo della versione completa prima di avviare il gioco…');
      }
      if (!navigator.onLine) {
        setStatus('Connessione non disponibile. La precedente versione rimane intatta; riprova quando torni online.');
      } else {
        setStatus('La nuova versione non è ancora pronta oppure altre schede di gioco sono aperte. Nessun salvataggio è stato toccato.');
      }
    } catch (err) {
      console.warn('[Update] Avvio:', err);
      setStatus('Impossibile verificare una versione integra. La cache e i salvataggi sono stati conservati.');
    } finally { updating = false; retry.hidden = navigating; }
  }
  retry.addEventListener('click', boot);
  window.addEventListener('online', () => { checkedThisOpening = false; boot(); });
  navigator.serviceWorker?.addEventListener('controllerchange', () => { if (!navigating) boot(); });
  boot();
})();
</script>
</body>
</html>
