<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050814">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UNIVERSUM">
  <meta name="description" content="UNIVERSUM — Strategia spaziale sci-fi offline e multiplayer PvP">
  <title>UNIVERSUM</title>

  <link rel="manifest" href="manifest.json">
  <link id="dynamic-favicon" rel="icon" type="image/png">
  <link id="dynamic-apple-icon" rel="apple-touch-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="boot-logo">UNIVERSUM</div>
      <div class="boot-sub">Inizializzazione Sistemi Galattici...</div>
    </div>
  </div>

  <!-- Firebase SDK (Compat v10 per GitHub Pages / PWA) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- Configurazione Firebase & Multiplayer -->
  <script src="firebase-config.js"></script>
  <script src="multiplayer.js"></script>

  <!-- Motore Grafico Procedurale (Diviso in 3 Moduli) -->
  <script src="graphics-core.js"></script>
  <script src="graphics-ships.js"></script>
  <script src="graphics-structures.js"></script>

  <!-- Core Game Engine & Database -->
  <script src="db.js"></script>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="galaxy.js"></script>
  <script src="ui.js"></script>

  <!-- Registrazione Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('Service Worker non registrato:', err);
        });
      });
    }
  </script>
</body>
</html>
