name: AT04-I01F single targeted specialist diagnostic
on:
  push:
    branches: ['diagnostic/AT04-I01F-emulator-5e75101']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover exact candidate and verify production freeze
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/at04f-logs"
          mkdir -p "$logs" "$RUNNER_TEMP/at04f-emulator"
          exec > >(tee "$logs/reconstruction.log") 2>&1
          base64 -d .at04-i01f/checkpoint.bundle.b64 > "$RUNNER_TEMP/at04f.bundle"
          echo "ae8e15e87f6030b4042c904d6816b2b315c04e252326fd5ce0fc9ef9cad0c5e6  $RUNNER_TEMP/at04f.bundle" | sha256sum -c
          git bundle verify "$RUNNER_TEMP/at04f.bundle"
          git fetch "$RUNNER_TEMP/at04f.bundle" refs/heads/candidate/AT04-I01F:refs/heads/at04f-local-candidate
          git worktree add --detach "$RUNNER_TEMP/at04f-game" 5e751018e8cde35ab49a6abf40581cd0745cef94
          cd "$RUNNER_TEMP/at04f-game"
          test "$(git rev-parse HEAD)" = 5e751018e8cde35ab49a6abf40581cd0745cef94
          test "$(git rev-parse HEAD^{tree})" = 9c329d08a9c483bb603d24fc078566c6f67d53de
          test "$(git rev-parse HEAD^)" = e42a542b9747d1c74cab7864d2214cff04324ca0
          test "$(git hash-object firestore.rules)" = 1285ecbee7b2e9e6cb415c521367f3b72282481f
          test "$(git hash-object .github/workflows/verify-release.yml)" = dbbabf89f705888b16de50bf24ca7dfba303d379
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' tests/helpers/historical-specialist-fixture.js tests/helpers/multiplayer-smoke.js | sort)"
          git diff --exit-code HEAD^ HEAD -- . ':!tests/helpers/historical-specialist-fixture.js' ':!tests/helpers/multiplayer-smoke.js'
          git fsck --full
          git diff --exit-code HEAD
          cp firestore.rules "$RUNNER_TEMP/at04f-emulator/firestore.rules"
          echo "788adc753f94db55b92a82ecda10484a66c1d07041bea2aaf2f6113174c9eab2  $RUNNER_TEMP/at04f-emulator/firestore.rules" | sha256sum -c
          git archive --format=zip --output="$RUNNER_TEMP/AT04-I01F-diagnostic.zip" HEAD
          sha256sum "$RUNNER_TEMP/AT04-I01F-diagnostic.zip"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install same isolated dependency versions as I01E
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/at04f-deps"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/at04f-browsers"
          npm install --prefix "$deps" --no-audit --no-fund firebase-tools@13.35.1 firebase@10.12.2 firebase-admin@12.7.0 playwright@1.51.1
          node "$deps/node_modules/playwright/cli.js" install --with-deps chromium
          export NODE_PATH="$deps/node_modules"
          chrome="$(node -p "require('playwright').chromium.executablePath()")"
          sdk="$deps/node_modules/firebase"
          test -x "$chrome"
          test -f "$sdk/firebase-app-compat.js"
          test -f "$sdk/firebase-firestore-compat.js"
          node --version
          java -version
          "$deps/node_modules/.bin/firebase" --version
          "$chrome" --version
          "$deps/node_modules/.bin/firebase" setup:emulators:firestore
          jar="$HOME/.cache/firebase/emulators/cloud-firestore-emulator-v1.19.8.jar"
          test -s "$jar"
          sha256sum "$jar"
          printf '%s\n' "NODE_PATH=$NODE_PATH" "CHROME_BIN=$chrome" "FIREBASE_SDK_DIR=$sdk" "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Real admin fixture preflight then original full specialists smoke
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/at04f-logs"
          cli="$RUNNER_TEMP/at04f-deps/node_modules/.bin/firebase"
          cd "$RUNNER_TEMP/at04f-emulator"
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false},"singleProjectMode":true}}' > firebase.json
          : > "$logs/results.txt"
          sha256sum firestore.rules | tee "$logs/loaded-rules.sha256"
          set +e
          GCLOUD_PROJECT=demo-universum GOOGLE_CLOUD_PROJECT=demo-universum "$cli" emulators:exec --project demo-universum --only firestore --config firebase.json "bash '$GITHUB_WORKSPACE/.at04-i01f/run.sh'" 2>&1 | tee "$logs/emulator.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "targeted session exit=$code" | tee -a "$logs/results.txt"
          if [ -f firestore-debug.log ]; then cp firestore-debug.log "$logs/firestore-debug.log"; fi
          grep -Ein 'maximum of 1000|evaluation.*limit|exceed(ed|s)?.*expression|too many.*(get|access)' "$logs"/*.log > "$logs/budget-suspicions.txt" || true
          if [ -s "$logs/budget-suspicions.txt" ]; then
            echo "FAIL budget diagnostics" | tee -a "$logs/results.txt"
            code=1
          fi
          cd "$RUNNER_TEMP/at04f-game"
          git diff --exit-code HEAD
          echo "Aggregate result: $code" | tee -a "$logs/results.txt"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT04-I01F-diagnostic-logs
          path: ${{ runner.temp }}/at04f-logs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT04-I01F-exact-candidate
          path: ${{ runner.temp }}/AT04-I01F-diagnostic.zip
