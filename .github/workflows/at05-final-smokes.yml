name: AT05 final diagnostic - exact prefinal checkpoint
on:
  push:
    branches: ['diagnostic/AT05-final-smokes-08942f0']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover original checkpoint and verify every Git identity
        run: bash .at05-final/restore.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated smoke dependencies
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/at05-deps"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/at05-browsers"
          npm install --prefix "$deps" --no-audit --no-fund firebase-tools@13 firebase@10.12.2 firebase-admin@12.7.0 playwright@1.51.1
          node "$deps/node_modules/playwright/cli.js" install --with-deps chromium
          export NODE_PATH="$deps/node_modules"
          chrome="$(node -p "require('playwright').chromium.executablePath()")"
          test -x "$chrome"
          sdk="$deps/node_modules/firebase"
          test -f "$sdk/firebase-app-compat.js"
          test -f "$sdk/firebase-firestore-compat.js"
          node --version
          java -version
          "$deps/node_modules/.bin/firebase" --version
          "$chrome" --version
          node -e "require('firebase-admin/app');require('firebase-admin/firestore');require('playwright');console.log('Dependencies available')"
          printf '%s\n' "NODE_PATH=$NODE_PATH" "CHROME_BIN=$chrome" "FIREBASE_SDK_DIR=$sdk" "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/at05-emulator"
          cp "$RUNNER_TEMP/at05-game/firestore.rules" "$RUNNER_TEMP/at05-emulator/firestore.rules"
          cmp "$RUNNER_TEMP/at05-game/firestore.rules" "$RUNNER_TEMP/at05-emulator/firestore.rules"
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false},"singleProjectMode":true}}' > "$RUNNER_TEMP/at05-emulator/firebase.json"
          "$deps/node_modules/.bin/firebase" setup:emulators:firestore
      - name: Environment preflight then three unchanged original smoke tests
        env:
          GCLOUD_PROJECT: demo-universum
          GOOGLE_CLOUD_PROJECT: demo-universum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/at05-emulator"
          "$RUNNER_TEMP/at05-deps/node_modules/.bin/firebase" emulators:exec --project demo-universum --only firestore --config firebase.json "bash '$GITHUB_WORKSPACE/.at05-final/run.sh'" 2>&1 | tee "$RUNNER_TEMP/at05-logs/emulator.log"
      - name: Verify unchanged checkpoint and prepare candidate only after three PASS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/at05-game"
          test "$(git rev-parse HEAD)" = 08942f02f3cbeba0cb7ed32f11bb19aff1226684
          test "$(git rev-parse HEAD^{tree})" = 2d2fcb783e5b526840bf49b017ffa407977454c7
          git diff --exit-code HEAD
          test "$(grep -c '^PASS tests/smoke_' "$RUNNER_TEMP/at05-logs/results.txt")" = 3
          test "$(wc -l < "$RUNNER_TEMP/at05-logs/results.txt")" = 3
          git archive --format=zip --output="$RUNNER_TEMP/AT05-final.zip" HEAD
          sha256sum "$RUNNER_TEMP/AT05-final.zip"
          git push origin HEAD:refs/heads/candidate/AT05-final-08942f0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT05-final-smoke-logs
          path: ${{ runner.temp }}/at05-logs/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AT05-final-verified-zip
          path: ${{ runner.temp }}/AT05-final.zip
