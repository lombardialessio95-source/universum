name: AT05 diagnostic only - local Emulator and Git recovery
on:
  push:
    branches: ['diagnostic/AT05-completion-20261127']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact I02 Git history and archive
        run: |
          set -eu
          base=7099402d8596d3a179191b8ff2427ac3145df897
          test "$(git rev-parse "$base^{tree}")" = d8a9a2f6b3adae30bf70b8f03e8b87cf3b1c468c
          test "$(git hash-object firestore.rules)" = 911d2a1e81185d3b489a22f9738ca1975c5ba7f8
          git branch verified-I02 "$base"
          git bundle create "$RUNNER_TEMP/UNIVERSUM-I02.bundle" refs/heads/verified-I02
          git bundle verify "$RUNNER_TEMP/UNIVERSUM-I02.bundle"
          git archive --format=zip --output="$RUNNER_TEMP/UNIVERSUM-I02.zip" "$base"
          sha256sum "$RUNNER_TEMP/UNIVERSUM-I02.bundle" "$RUNNER_TEMP/UNIVERSUM-I02.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AT05-I02-complete-git
          path: |
            ${{ runner.temp }}/UNIVERSUM-I02.bundle
            ${{ runner.temp }}/UNIVERSUM-I02.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare disposable emulator, unchanged rules
        run: |
          set -eu
          npm install --prefix "$RUNNER_TEMP/at05-cli" firebase-tools@13
          npm install --prefix "$RUNNER_TEMP/at05-sdk" firebase@10.12.2
          mkdir -p "$RUNNER_TEMP/at05-emulator"
          cp firestore.rules "$RUNNER_TEMP/at05-emulator/"
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}' > "$RUNNER_TEMP/at05-emulator/firebase.json"
          "$RUNNER_TEMP/at05-cli/node_modules/.bin/firebase" setup:emulators:firestore
      - name: Export disposable runtime for reproducible local testing
        run: |
          set -eu
          tar -czf "$RUNNER_TEMP/at05-sdk.tgz" -C "$RUNNER_TEMP/at05-sdk" node_modules
          cp "$HOME"/.cache/firebase/emulators/cloud-firestore-emulator-*.jar "$RUNNER_TEMP/"
      - uses: actions/upload-artifact@v4
        with:
          name: AT05-emulator-runtime
          path: |
            ${{ runner.temp }}/at05-sdk.tgz
            ${{ runner.temp }}/cloud-firestore-emulator-*.jar
      - name: Actual Rules diagnostic - no production connection
        run: |
          cd "$RUNNER_TEMP/at05-emulator"
          "$RUNNER_TEMP/at05-cli/node_modules/.bin/firebase" emulators:exec --project demo-universum-at05 --only firestore --config firebase.json "python3 '$GITHUB_WORKSPACE/.at05-diagnostics/rules_probe.py'" 2>&1 | tee "$RUNNER_TEMP/at05-rules.log"
        shell: bash --noprofile --norc -eo pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT05-rules-diagnostic-log
          path: ${{ runner.temp }}/at05-rules.log
