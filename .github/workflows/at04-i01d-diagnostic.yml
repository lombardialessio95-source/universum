name: AT04-I01D single isolated diagnostic
on:
  push:
    branches: ['diagnostic/AT04-I01D-emulator-caecbd8']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover exact local candidate and check hashes
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/at04d-logs"
          mkdir -p "$logs" "$RUNNER_TEMP/at04d-emulator"
          exec > >(tee "$logs/reconstruction.log") 2>&1
          base64 -d .at04-i01d/checkpoint.bundle.b64 > "$RUNNER_TEMP/at04d.bundle"
          echo "c748835c27d1563c0d2f1b5fca07ec28bb75e85cacea0cb83a94fb5fa59ed76e  $RUNNER_TEMP/at04d.bundle" | sha256sum -c
          git bundle verify "$RUNNER_TEMP/at04d.bundle"
          git fetch "$RUNNER_TEMP/at04d.bundle" refs/heads/candidate/AT04-I01D:refs/heads/at04d-local-candidate
          git worktree add --detach "$RUNNER_TEMP/at04d-game" caecbd8a6cd7778043f7e6c27513d79338e2c94c
          cd "$RUNNER_TEMP/at04d-game"
          test "$(git rev-parse HEAD)" = caecbd8a6cd7778043f7e6c27513d79338e2c94c
          test "$(git rev-parse HEAD^{tree})" = 05ba67aa8834c96dc5d71e843c260780726f353a
          test "$(git hash-object firestore.rules)" = b98087f72f0291dba76dca54afd1cbcaa784c553
          test "$(git hash-object .github/workflows/verify-release.yml)" = dbbabf89f705888b16de50bf24ca7dfba303d379
          git merge-base --is-ancestor 63a05400049430676e66c483db88e807f483dc9e HEAD
          test "$(git rev-parse HEAD^)" = a9120900424af5aaf72eb2711e3d1cc21505bea9
          git diff --exit-code HEAD^ HEAD -- tests modules .github
          test "$(git diff --name-only HEAD^ HEAD)" = firestore.rules
          git fsck --full
          git diff --exit-code HEAD
          git show fb8f9e1b79c8e7039d8191021fce4a190202d3ae:firestore.rules > "$RUNNER_TEMP/at04d-emulator/baseline.rules"
          cp firestore.rules "$RUNNER_TEMP/at04d-emulator/candidate.rules"
          sha256sum "$RUNNER_TEMP/at04d-emulator/"*.rules
          git archive --format=zip --output="$RUNNER_TEMP/AT04-I01D-diagnostic.zip" HEAD
          sha256sum "$RUNNER_TEMP/AT04-I01D-diagnostic.zip"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install same isolated dependency versions as AT05
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/at04d-deps"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/at04d-browsers"
          npm install --prefix "$deps" --no-audit --no-fund firebase-tools@13.35.1 firebase@10.12.2 firebase-admin@12.7.0 playwright@1.51.1
          node "$deps/node_modules/playwright/cli.js" install --with-deps chromium
          export NODE_PATH="$deps/node_modules"
          chrome="$(node -p "require('playwright').chromium.executablePath()")"
          sdk="$deps/node_modules/firebase"
          test -x "$chrome"
          test -f "$sdk/firebase-app-compat.js"
          test -f "$sdk/firebase-firestore-compat.js"
          node --version
          java -version
          "$deps/node_modules/.bin/firebase" --version
          "$chrome" --version
          "$deps/node_modules/.bin/firebase" setup:emulators:firestore
          jar="$HOME/.cache/firebase/emulators/cloud-firestore-emulator-v1.19.8.jar"
          test -s "$jar"
          sha256sum "$jar"
          printf '%s\n' "NODE_PATH=$NODE_PATH" "CHROME_BIN=$chrome" "FIREBASE_SDK_DIR=$sdk" "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" "FIRESTORE_EMULATOR_JAR=$jar" >> "$GITHUB_ENV"
      - name: Fail-fast compiler baseline and candidate, then green SDK and regressions
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/at04d-logs"
          cli="$RUNNER_TEMP/at04d-deps/node_modules/.bin/firebase"
          cd "$RUNNER_TEMP/at04d-emulator"
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false},"singleProjectMode":true}}' > firebase.json
          : > "$logs/results.txt"
          failed=0
          group() {
            local name="$1" project="$2" source="$3" command="${4:-$1}" code
            cp "$source.rules" firestore.rules
            cmp "$source.rules" firestore.rules
            sha256sum firestore.rules | tee "$logs/$name-loaded-file.sha256"
            set +e
            GCLOUD_PROJECT="$project" GOOGLE_CLOUD_PROJECT="$project" "$cli" emulators:exec --project "$project" --only firestore --config firebase.json "bash '$GITHUB_WORKSPACE/.at04-i01d/run.sh' '$command' '$project'" 2>&1 | tee "$logs/$name-emulator.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "group $name exit=$code" | tee -a "$logs/results.txt"
            test ! -f firestore-debug.log || cp firestore-debug.log "$logs/$name-firestore-debug.log"
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          group compile-baseline demo-universum baseline compile
          group compile-candidate demo-universum candidate compile
          if [ "$failed" -ne 0 ]; then
            echo "Compiler preflight failed: full battery not started" | tee -a "$logs/results.txt"
            exit 1
          fi
          echo "Both compiler preflights PASS. Red reused from run 46070797887 (identical baseline and tests)." | tee -a "$logs/results.txt"
          group green demo-universum candidate
          group at03 demo-universum-at03-i01 candidate
          group at05 demo-universum-at05 candidate
          cd "$RUNNER_TEMP/at04d-game"
          for test in tests/test_d05_rules.py tests/test_specialist_rules.py tests/test_suprema_privacy_emulator.py; do
            name="$(basename "$test" .py)"
            set +e
            timeout 240s python3 "$test" 2>&1 | tee "$logs/$name.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$name exit=$code" | tee -a "$logs/results.txt"
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          for test in tests/test_*.js; do
            name="$(basename "$test" .js)"
            set +e
            timeout 120s node "$test" > "$logs/$name.log" 2>&1
            code=$?
            set -e
            echo "$name exit=$code" | tee -a "$logs/results.txt"
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          python3 tools/build_release.py
          git diff --exit-code HEAD
          grep -Ein 'maximum of 1000|evaluation.*limit|exceed(ed|s)?.*expression|too many.*(get|access)' "$logs"/*emulator.log "$logs"/*firestore-debug.log > "$logs/budget-suspicions.txt" || true
          echo "Aggregate result: $failed" | tee -a "$logs/results.txt"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT04-I01D-diagnostic-logs
          path: ${{ runner.temp }}/at04d-logs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT04-I01D-exact-candidate
          path: ${{ runner.temp }}/AT04-I01D-diagnostic.zip
