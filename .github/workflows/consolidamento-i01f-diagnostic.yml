name: AT03-AT04 consolidamento I01F - single original case and exact transport
on:
  push:
    branches: ['diagnostic/AT03-AT04-consolidamento-5e75101']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Recover original Git objects and verify freeze
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/cons-logs"
          mkdir -p "$logs" "$RUNNER_TEMP/cons-demo"
          exec > >(tee "$logs/identity.log") 2>&1
          git show e72afd7472da6e25b2fa1f66aeb5c491b1b505c1:.at04-i01f/checkpoint.bundle.b64 | base64 -d > "$RUNNER_TEMP/i01f.bundle"
          echo "ae8e15e87f6030b4042c904d6816b2b315c04e252326fd5ce0fc9ef9cad0c5e6  $RUNNER_TEMP/i01f.bundle" | sha256sum -c
          git bundle verify "$RUNNER_TEMP/i01f.bundle"
          git fetch "$RUNNER_TEMP/i01f.bundle" refs/heads/candidate/AT04-I01F:refs/heads/cons-local-i01f
          git worktree add --detach "$RUNNER_TEMP/cons-game" 5e751018e8cde35ab49a6abf40581cd0745cef94
          cd "$RUNNER_TEMP/cons-game"
          test "$(git rev-parse HEAD)" = 5e751018e8cde35ab49a6abf40581cd0745cef94
          test "$(git rev-parse HEAD^{tree})" = 9c329d08a9c483bb603d24fc078566c6f67d53de
          git merge-base --is-ancestor 08942f02f3cbeba0cb7ed32f11bb19aff1226684 HEAD
          test "$(git hash-object firestore.rules)" = 1285ecbee7b2e9e6cb415c521367f3b72282481f
          test "$(git hash-object .github/workflows/verify-release.yml)" = dbbabf89f705888b16de50bf24ca7dfba303d379
          git diff --exit-code 08942f02f3cbeba0cb7ed32f11bb19aff1226684 HEAD -- .github
          git fsck --full
          git diff --exit-code HEAD
          cp firestore.rules "$RUNNER_TEMP/cons-demo/firestore.rules"
          echo "788adc753f94db55b92a82ecda10484a66c1d07041bea2aaf2f6113174c9eab2  $RUNNER_TEMP/cons-demo/firestore.rules" | sha256sum -c
          git archive --format=zip --output="$RUNNER_TEMP/cons-I01F.zip" HEAD
          echo "78bfdd66feeac0c98b85a987f0f08cadb3455121314209cd115b888ca558a013  $RUNNER_TEMP/cons-I01F.zip" | sha256sum -c
          # Original case is imported into a SEPARATE bare repository, never into the release tree.
          cd "$GITHUB_WORKSPACE"
          git show 9f1f8825aa13467fe5387f4606249bcc24d6aff9:.at04-i02b/checkpoint.bundle.b64 | base64 -d > "$RUNNER_TEMP/i02b-fixture.bundle"
          echo "e5943766a7fd42cabe705125a40238ef2316ea42c8c59d8e8db1e091dd252bbc  $RUNNER_TEMP/i02b-fixture.bundle" | sha256sum -c
          git clone --bare --no-tags --single-branch --branch main . "$RUNNER_TEMP/cons-fixture.git"
          git -C "$RUNNER_TEMP/cons-fixture.git" bundle verify "$RUNNER_TEMP/i02b-fixture.bundle"
          git -C "$RUNNER_TEMP/cons-fixture.git" fetch "$RUNNER_TEMP/i02b-fixture.bundle" refs/heads/candidate/AT04-I02B:refs/heads/fixture-only
          git -C "$RUNNER_TEMP/cons-fixture.git" show 76e4921e00ee467971e34412908ce7d13177f4d7:tests/helpers/at04_integrity_cases.js > "$RUNNER_TEMP/cons-demo/original-cases.js"
          echo "e9da2287b538dc5b65c3fb54a39e1d8ee4de62362edf1e536db77ca2c299e0fe  $RUNNER_TEMP/cons-demo/original-cases.js" | sha256sum -c
          cp .consolidamento/smoke-original-case.js "$RUNNER_TEMP/cons-demo/smoke-original-case.js"
          git -C "$RUNNER_TEMP/cons-game" diff --exit-code HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install same pinned Emulator and SDK for the single case
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/cons-deps"
          npm install --prefix "$deps" --no-audit --no-fund firebase-tools@13.35.1 firebase@10.12.2
          "$deps/node_modules/.bin/firebase" setup:emulators:firestore
          jar="$HOME/.cache/firebase/emulators/cloud-firestore-emulator-v1.19.8.jar"
          test -s "$jar"
          sha256sum "$jar"
          node --version
          java -version
          "$deps/node_modules/.bin/firebase" --version
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
      - name: Single real SDK positive case against frozen I01F
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/cons-logs"
          cd "$RUNNER_TEMP/cons-demo"
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false},"singleProjectMode":true}}' > firebase.json
          sha256sum firestore.rules | tee "$logs/loaded-rules.sha256"
          cat > run-case.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          logs="$RUNNER_TEMP/cons-logs"
          trap 'curl -fsS --max-time 30 http://127.0.0.1:8080/emulator/v1/projects/demo-universum:ruleCoverage -o "$logs/coverage.json" || true' EXIT
          RULES_FILE="$PWD/firestore.rules" timeout 120s node smoke-original-case.js 2>&1 | tee "$logs/smoke.log"
          SH
          set +e
          GCLOUD_PROJECT=demo-universum GOOGLE_CLOUD_PROJECT=demo-universum "$RUNNER_TEMP/cons-deps/node_modules/.bin/firebase" emulators:exec --project demo-universum --only firestore --config firebase.json "bash run-case.sh" 2>&1 | tee "$logs/emulator.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ -f firestore-debug.log ]; then cp firestore-debug.log "$logs/firestore-debug.log"; fi
          grep -Ein 'maximum of 1000|evaluation.*limit|exceed(ed|s)?.*expression|too many.*(get|access)' "$logs"/*.log > "$logs/budget-suspicions.txt" || true
          echo "targeted single case exit=$code" | tee "$logs/results.txt"
          test "$code" -eq 0
          test ! -s "$logs/budget-suspicions.txt"
          grep -Fq 'PASS all 17 classes change on due attack plus loot and surviving hangars' "$logs/smoke.log"
          git -C "$RUNNER_TEMP/cons-game" diff --exit-code HEAD
      - name: Transfer exact approved original commit to new candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/cons-logs"
          exec > >(tee "$logs/transport.log") 2>&1
          target='refs/heads/candidate/AT03-AT04-consolidamento-5e75101'
          backup='refs/heads/backup/pre-AT03-AT04-consolidamento-08942f0'
          sha='5e751018e8cde35ab49a6abf40581cd0745cef94'
          base='08942f02f3cbeba0cb7ed32f11bb19aff1226684'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test "$(git ls-remote origin "$backup" | cut -f1)" = "$base"
          test -z "$(git ls-remote origin "$target")"
          # Empty lease means create only; cannot overwrite an existing ref.
          git push --force-with-lease="$target:" origin "$sha:$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$sha"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test "$(git ls-remote origin "$backup" | cut -f1)" = "$base"
          echo "PASS exact original SHA transferred: $sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT03-AT04-consolidamento-diagnostic-logs
          path: ${{ runner.temp }}/cons-logs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT03-AT04-consolidamento-exact-I01F
          path: ${{ runner.temp }}/cons-I01F.zip
