name: AT04-I02 single isolated diagnostic
on:
  push:
    branches: ['diagnostic/AT04-I02-emulator-1f02e9c']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover exact local candidate and check hashes
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/at04i02-logs"
          mkdir -p "$logs" "$RUNNER_TEMP/at04i02-emulator"
          exec > >(tee "$logs/reconstruction.log") 2>&1
          base64 -d .at04-i02/checkpoint.bundle.b64 > "$RUNNER_TEMP/at04i02.bundle"
          echo "10fe1bccfaa7a2a45169116436bc82e45dab429d57df244b5e7680e70f5bdba6  $RUNNER_TEMP/at04i02.bundle" | sha256sum -c
          git bundle verify "$RUNNER_TEMP/at04i02.bundle"
          git fetch "$RUNNER_TEMP/at04i02.bundle" refs/heads/candidate/AT04-I02:refs/heads/at04i02-local-candidate
          git worktree add --detach "$RUNNER_TEMP/at04i02-game" 1f02e9c1bdf4e8508d8e5e791bd1954021622c9e
          cd "$RUNNER_TEMP/at04i02-game"
          test "$(git rev-parse HEAD)" = 1f02e9c1bdf4e8508d8e5e791bd1954021622c9e
          test "$(git rev-parse HEAD^{tree})" = fa6eceb5bb14901d1dc5dd81a82bb025e2210981
          test "$(git hash-object firestore.rules)" = ecc26b41b7abd62b08207ac49efae85ef9cadd69
          test "$(git hash-object .github/workflows/verify-release.yml)" = dbbabf89f705888b16de50bf24ca7dfba303d379
          git merge-base --is-ancestor 63a05400049430676e66c483db88e807f483dc9e HEAD
          test "$(git rev-parse HEAD^)" = 5e751018e8cde35ab49a6abf40581cd0745cef94
          git diff --exit-code HEAD^ HEAD -- modules .github
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' firestore.rules tests/helpers/at04_integrity_cases.js tests/smoke_at04_i02_integrity_emulator.js tests/smoke_at04_i02_resolver_emulator.js tests/test_at04_integrity_model.js | sort)"
          git fsck --full
          git diff --exit-code HEAD
          git show 5e751018e8cde35ab49a6abf40581cd0745cef94:firestore.rules > "$RUNNER_TEMP/at04i02-emulator/baseline.rules"
          cp firestore.rules "$RUNNER_TEMP/at04i02-emulator/candidate.rules"
          echo "75aad3439fd13b0cbba5f047dcd47e5c20cdfd677083697701de9581f981e4a5  $RUNNER_TEMP/at04i02-emulator/candidate.rules" | sha256sum -c
          echo "788adc753f94db55b92a82ecda10484a66c1d07041bea2aaf2f6113174c9eab2  $RUNNER_TEMP/at04i02-emulator/baseline.rules" | sha256sum -c
          sha256sum "$RUNNER_TEMP/at04i02-emulator/"*.rules
          git archive --format=zip --output="$RUNNER_TEMP/AT04-I02-diagnostic.zip" HEAD
          sha256sum "$RUNNER_TEMP/AT04-I02-diagnostic.zip"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install same isolated dependency versions as AT05
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/at04i02-deps"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/at04i02-browsers"
          npm install --prefix "$deps" --no-audit --no-fund firebase-tools@13.35.1 firebase@10.12.2 firebase-admin@12.7.0 playwright@1.51.1
          node "$deps/node_modules/playwright/cli.js" install --with-deps chromium
          export NODE_PATH="$deps/node_modules"
          chrome="$(node -p "require('playwright').chromium.executablePath()")"
          sdk="$deps/node_modules/firebase"
          test -x "$chrome"
          test -f "$sdk/firebase-app-compat.js"
          test -f "$sdk/firebase-firestore-compat.js"
          node --version
          java -version
          "$deps/node_modules/.bin/firebase" --version
          "$chrome" --version
          "$deps/node_modules/.bin/firebase" setup:emulators:firestore
          jar="$HOME/.cache/firebase/emulators/cloud-firestore-emulator-v1.19.8.jar"
          test -s "$jar"
          sha256sum "$jar"
          printf '%s\n' "NODE_PATH=$NODE_PATH" "CHROME_BIN=$chrome" "FIREBASE_SDK_DIR=$sdk" "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" "FIRESTORE_EMULATOR_JAR=$jar" >> "$GITHUB_ENV"
      - name: Compiler and critical budget preflight, then complete SDK and regression tests
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/at04i02-logs"
          cli="$RUNNER_TEMP/at04i02-deps/node_modules/.bin/firebase"
          cd "$RUNNER_TEMP/at04i02-emulator"
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false},"singleProjectMode":true}}' > firebase.json
          : > "$logs/results.txt"
          failed=0
          group() {
            local name="$1" project="$2" source="$3" command="${4:-$1}" code
            cp "$source.rules" firestore.rules
            cmp "$source.rules" firestore.rules
            sha256sum firestore.rules | tee "$logs/$name-loaded-file.sha256"
            set +e
            GCLOUD_PROJECT="$project" GOOGLE_CLOUD_PROJECT="$project" "$cli" emulators:exec --project "$project" --only firestore --config firebase.json "bash '$GITHUB_WORKSPACE/.at04-i02/run.sh' '$command' '$project'" 2>&1 | tee "$logs/$name-emulator.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "group $name exit=$code" | tee -a "$logs/results.txt"
            test ! -f firestore-debug.log || cp firestore-debug.log "$logs/$name-firestore-debug.log"
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          group compile-baseline demo-universum baseline compile
          group compile-candidate demo-universum candidate compile
          if [ "$failed" -ne 0 ]; then
            echo "Compiler preflight failed: full battery not started" | tee -a "$logs/results.txt"
            exit 1
          fi
          echo "Both compiler preflights PASS." | tee -a "$logs/results.txt"
          group critical demo-universum candidate
          if [ "$failed" -ne 0 ] || grep -Eiq 'maximum of 1000 expressions to evaluate has been reached|too many document access calls' "$logs"/critical-i02.log "$logs"/critical-emulator.log; then
            echo "Critical preflight failed: full battery not started" | tee -a "$logs/results.txt"
            exit 1
          fi
          group red demo-universum baseline
          group green demo-universum candidate
          group at03 demo-universum-at03-i01 candidate
          group at05 demo-universum-at05 candidate
          cd "$RUNNER_TEMP/at04i02-game"
          for test in tests/test_d05_rules.py tests/test_specialist_rules.py tests/test_suprema_privacy_emulator.py; do
            name="$(basename "$test" .py)"
            set +e
            timeout 240s python3 "$test" 2>&1 | tee "$logs/$name.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$name exit=$code" | tee -a "$logs/results.txt"
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          for test in tests/test_*.js; do
            name="$(basename "$test" .js)"
            set +e
            timeout 120s node "$test" > "$logs/$name.log" 2>&1
            code=$?
            set -e
            echo "$name exit=$code" | tee -a "$logs/results.txt"
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          python3 tools/build_release.py
          git diff --exit-code HEAD
          grep -Ein 'maximum of 1000|evaluation.*limit|exceed(ed|s)?.*expression|too many.*(get|access)' "$logs"/*emulator.log "$logs"/*firestore-debug.log > "$logs/budget-suspicions.txt" || true
          if [ -s "$logs/budget-suspicions.txt" ]; then
            echo "FAIL budget diagnostics: no budget-based deny counts as security proof" | tee -a "$logs/results.txt"
            failed=1
          fi
          echo "Aggregate result: $failed" | tee -a "$logs/results.txt"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT04-I02-diagnostic-logs
          path: ${{ runner.temp }}/at04i02-logs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT04-I02-exact-candidate
          path: ${{ runner.temp }}/AT04-I02-diagnostic.zip
